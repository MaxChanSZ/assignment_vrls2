<!DOCTYPE html>
<html lang="en">
<body>
<div class="vehicle-detail-card" (click)="onCloseClicked()">

    <div class="modal-window">
        <div class="header">
            <h3>Vehicle Information</h3>
        </div>

        <div class="detail-grid" *ngIf="vehicle">
            <p><strong>ID:</strong> {{ vehicle.id || 'N/A' }}</p>
            <p><strong>UUID:</strong> {{ vehicle.uuid }}</p>
            <p><strong>Brand:</strong> {{ vehicle.brand }}</p>
            <p><strong>Type:</strong> {{ vehicle.type }}</p>
            <p><strong>Status:</strong> {{ vehicle.registrationStatus }}</p>
            <p><strong>Category:</strong> {{ vehicle.recordCategory }}</p>
            <p><strong>Registration Start:</strong> {{ vehicle.startDate }}</p>
            <p><strong>Registration End:</strong> {{ vehicle.endDate }}</p>
        </div>
        <button class="close-btn" (click)="onCloseClicked()">Close</button>
    </div>
</div>
</body>
</html>
